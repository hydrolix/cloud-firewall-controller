{{- if .Values.firewall }}
{{- if and (hasKey .Values.firewall "defaultRules") (eq (toString .Values.firewall.defaultRules) "false") (not .Values.firewall.inbound) }}
{{- fail "firewall.defaultRules is false but firewall.inbound is empty: the firewall would drop all inbound traffic to the nodes. List every inbound rule the nodes need, or leave firewall.defaultRules unset." }}
{{- end }}
apiVersion: networking.linode.com/alpha1v1
kind: CloudFirewall
metadata:
  name: primary
  namespace: kube-system
spec:
  # defaultRules is true by default; leave empty to use defaults only
  {{- if hasKey .Values.firewall "defaultRules" }}
  defaultRules: {{ .Values.firewall.defaultRules }}
  {{- end }}
  # Empty rule lists are left out rather than rendered as [], because the controller
  # drops them when it updates the object and ArgoCD would then report a difference.
  ruleset:{{ if not (or .Values.firewall.inbound .Values.firewall.outbound) }} {}{{ end }}
    # Policies default to DROP/ACCEPT; override if desired
    # inbound_policy:  "DROP"
    # outbound_policy: "ACCEPT"
    {{- with .Values.firewall.outbound }}
    outbound: {{ toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.firewall.inbound }}
    inbound: {{ toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
