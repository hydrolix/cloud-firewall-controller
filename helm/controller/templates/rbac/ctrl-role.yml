---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-firewall-controller
  namespace: {{ required ".Values.namespace required" .Values.namespace }}
rules:
- apiGroups:
  - apps
  resourceNames:
  - cloud-firewall-controller
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
